services:
  - type: web
    name: validador-dispensa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: OCR_ENABLED
        value: "true"
      - key: MAX_PDF_SIZE_MB
        value: "50"
      - key: IA_ENABLED
        value: "true"
      - key: KILO_API_KEY
        sync: false
      - key: KILO_BASE_URL
        value: https://api.kilo.ai/api/gateway
      - key: IA_MODEL
        value: openrouter/free
